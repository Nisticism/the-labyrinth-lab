<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2f2622" />
    <!--
      Per-page <title>, description, canonical, and og/twitter title/description/
      url/image are managed at runtime by react-helmet-async (see components/seo).
      Only constants and no-JS fallbacks live here to avoid duplicate tags.
    -->
    <meta name="keywords" content="San Antonio woodworking, custom woodworking, handcrafted wood, labyrinths, chess boards, charcuterie boards, wood furniture, wood pens, wood tops, wood paddles, custom commissions, Texas woodworking, The Labyrinth Lab" />
    <meta name="author" content="The Labyrinth Lab" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.jpg" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "The Labyrinth Lab",
        "description": "Custom handcrafted woodworking in San Antonio, Texas. Specializing in labyrinths, chess boards, charcuterie boards, furniture, pens, and more.",
        "url": "https://the-ll.com",
        "image": "https://the-ll.com/images/thomas-moralez/OTM-1.jpg",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "San Antonio",
          "addressRegion": "TX",
          "addressCountry": "US"
        },
        "sameAs": [
          "https://www.etsy.com/shop/LabyrinthLab"
        ]
      }
    </script>
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
    <title>The Labyrinth Lab — Custom Woodworking in San Antonio, TX</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

</html>
